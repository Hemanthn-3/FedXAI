[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fedpedia-xai"
version = "0.1.0"
description = "Privacy-preserving federated healthcare prediction platform with explainable AI."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "Proprietary" }
authors = [
  { name = "FedPedia-XAI Project Team" }
]
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "cryptography>=42,<44",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "flwr>=1.10,<2",
  "httpx>=0.27,<1",
  "lime>=0.2.0.1,<1",
  "shap>=0.42,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.0,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "psycopg[binary]>=3.1,<4",
  "pyjwt>=2.9,<3",
  "redis>=5,<7",
  "reportlab>=4.0,<5",
  "scikit-learn>=1.3,<2",
  "sqlalchemy>=2.0,<3",
  "torch>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "aiosqlite>=0.19,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "backend",
  "fl_server",
  "hospital_nodes",
  "xai_engine",
  "analytics",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["backend", "fl_server", "hospital_nodes", "xai_engine", "analytics"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/v1/auth.py" = ["S106"]
"backend/app/auth/dependencies.py" = ["S106"]
"backend/app/auth/security.py" = ["S105", "S106"]
"backend/app/schemas/auth.py" = ["S105"]
"backend/app/services/report_service.py" = ["E501"]
"tests/**/*.py" = ["S105", "S106", "E501"]
